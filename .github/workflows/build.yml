name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Rust
      run: |
        rustup update stable --no-self-update
        rustup default stable
        rustup component add clippy rustfmt

    - name: Check formatting
      run: cargo fmt --check

    - name: Lint
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Test
      run: cargo test --locked

    - name: Check the TV app's scripts
      run: |
        node --check tv/app/main.js
        node --check tv/service/service.js
        node tests/tv/ssap-frames.test.js tv/service/service.js

    - name: Build release
      run: cargo build --release --locked

    - name: Package
      shell: pwsh
      run: |
        $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
        if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
          throw "Tag $env:GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
        }
        New-Item -ItemType Directory out, package | Out-Null
        Copy-Item target/release/MagicRemoteService.exe, install.bat, install.ps1, README.md, LICENSE package/
        Compress-Archive -Path package/* -DestinationPath "out/MagicRemoteService-$version.zip"
        Copy-Item target/release/MagicRemoteService.exe out/

    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: MagicRemoteService
        path: out/
        retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: MagicRemoteService
        path: out

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd out
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$TAG" MagicRemoteService.exe MagicRemoteService-*.zip --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$TAG" MagicRemoteService.exe MagicRemoteService-*.zip --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
        fi
